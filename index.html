<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級社會科線上練習大題庫（阿妮的版本）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i> 115上 南一 五年級社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：五上第一~二單元（100% 完整收錄 4 份月考 A/B 卷 + 2 份隨堂卷所有題型）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 140 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對：0 題（目前得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-studies-quiz/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 完整收錄 6 份試卷（共 140 題）的題庫與詳解
        const allQuestions = [
            // ================= 一、是非題（整合 6 份考卷） =================
            // 1. 第一單元月考 A 卷 (A01)
            { type: "TF", q: "距今約三萬年前，臺灣已有人類聚居在洞穴裡。", ans: true, explanation: "舊石器時代的長濱文化（如八仙洞遺址），距今約三萬年前已有人類居住在天然海蝕洞穴中。" },
            { type: "TF", q: "臺灣的區域範圍包含臺灣島與周圍島嶼。", ans: true, explanation: "臺灣的區域範圍包含面積最大的臺灣島，以及澎湖、金門、馬祖、綠島、蘭嶼等周圍島嶼。" },
            { type: "TF", q: "史前時期的劃分，是依據器物材質和製作方法的差異。", ans: true, explanation: "考古學家主要依據人類使用工具的材質與製作方法，劃分為舊石器、新石器與金屬器時期。" },
            { type: "TF", q: "東部海岸的特色是可以看到珊瑚礁露出海面。", ans: false, explanation: "東部海岸大多為陡峭的斷崖海岸；南部恆春半島才以珊瑚礁海岸聞名。" },
            { type: "TF", q: "臺灣的地理位置和自然環境，適合候鳥棲息。", ans: true, explanation: "臺灣位處東亞候鳥遷徙路徑的中繼站，加上有豐富的溼地環境，非常適合候鳥度冬棲息。" },
            { type: "TF", q: "臺灣經過板塊擠壓，形成以平原為主體的島嶼，也有多樣的地形和不同的生活樣貌。", ans: false, explanation: "臺灣經過板塊擠壓，形成以「山地」為主體的島嶼，而非平原。" },
            { type: "TF", q: "赤道將地球分成東、西半球，其中臺灣位於西半球，亞洲東側與太平洋交會處。", ans: false, explanation: "赤道是將地球分成「南、北半球」，其中臺灣位於「北半球」（且在東半球）。" },
            { type: "TF", q: "史前時期人們的工具大多就地取材，像是將石頭敲打成工具。", ans: true, explanation: "史前人類善於利用自然資源就地取材，如利用石頭、獸骨製作工具。" },
            { type: "TF", q: "史前時期的人們開始發展農耕活動後，逐漸定居並形成聚落。", ans: true, explanation: "新石器時期發展出農耕與畜牧，食物來源穩定後便開始定居並形成聚落。" },
            { type: "TF", q: "人們利用潟湖及岬灣等地形修築港口，從事航運等活動。", ans: true, explanation: "潟湖（如高雄港）與岬灣（如基隆港、蘇澳港）風浪較平靜，適合修築港口發展航運與漁業。" },

            // 2. 第一單元月考 B 卷 (B01)
            { type: "TF", q: "臺灣位處候鳥遷徙的路徑上，每年冬季時，黑面琵鷺會從北方飛來臺灣度冬。", ans: true, explanation: "每年秋季約9月起，黑面琵鷺會從朝鮮半島及中國東北飛來臺灣西南沿海溼地度冬。" },
            { type: "TF", q: "在花蓮縣海岸看到的海景，屬於臺灣海峽的海域。", ans: false, explanation: "花蓮縣位於臺灣東部，看到的海景屬於「太平洋」海域。" },
            { type: "TF", q: "八仙洞遺址的人們主要以捕撈魚蝦及採集果實為生，並且懂得用火燒烤食物。", ans: true, explanation: "八仙洞遺址屬舊石器時期，人們過著採集、漁獵生活並已知用火。" },
            { type: "TF", q: "史前時期沒有文字紀錄，只能根據遺留的物品及環境推測。", ans: true, explanation: "史前時期尚未發展出文字，需依靠考古出土的遺物與遺跡來推測當時生活。" },
            { type: "TF", q: "新石器時期的人們受限於技術，無法發展海上貿易。", ans: false, explanation: "新石器時期的人們已經具備航海技術，並發展出跨海交易（如臺灣玉器外銷）。" },
            { type: "TF", q: "高雄港是利用岬灣開發而成的重要商港。", ans: false, explanation: "高雄港位於西部沙岸，是利用天然「潟湖」開發而成的重要商港。" },
            { type: "TF", q: "恆春半島海域溫暖，有獨特的珊瑚礁海岸。", ans: true, explanation: "南部恆春半島海域溫暖清澈，適合珊瑚生長，形成獨特的珊瑚礁海岸。" },
            { type: "TF", q: "在四處尋找食物的時光裡，史前的人們已經開始定居，並發展成聚落。", ans: false, explanation: "在四處採集狩獵的舊石器時期尚未定居，是到新石器時期發展簡單農耕活動後才開始定居。" },
            { type: "TF", q: "臺灣的區域範圍中，面積最大的島是澎湖群島。", ans: false, explanation: "臺灣的區域範圍中，面積最大的島是「臺灣島」（本島）。" },
            { type: "TF", q: "受板塊運動影響，臺灣於大約六百萬年前冒出海平面，至今板塊仍持續推擠，造成地震。", ans: true, explanation: "歐亞板塊與菲律賓海板塊持續推擠，使臺灣島高度持續增加且地震頻繁。" },

            // 3. 第一~二單元月考 A 卷 (A04)
            { type: "TF", q: "原住民族的祖先認為萬物皆有神靈，相信「萬物有靈」。", ans: true, explanation: "原住民族傳統信仰中敬畏自然，相信自然界萬物皆有靈魂與神靈。" },
            { type: "TF", q: "媽祖是跨地域的信仰，擁有眾多的信眾。", ans: true, explanation: "媽祖原為航海守護神，後來發展為全臺跨地域、跨族群的普遍民間信仰。" },
            { type: "TF", q: "發表毀損別人名譽的言論，並不會受到任何處罰。", ans: false, explanation: "發表毀損他人名譽的言論有可能觸犯法律（如刑法誹謗罪或公然侮辱罪）而受罰。" },
            { type: "TF", q: "「規範」是社會群體共同認可與遵守的行為標準。", ans: true, explanation: "社會規範包含風俗習慣、倫理道德、宗教信仰與法律，是群體共同遵守的行為準則。" },
            { type: "TF", q: "某架飛機從臺灣出發，依最短路徑飛往韓國，其飛行過程會經過巴士海峽。", ans: false, explanation: "韓國位於臺灣北方，飛往韓國會經過「東海」；巴士海峽位於臺灣南方。" },
            { type: "TF", q: "如果傳統規範與現代社會需求產生衝突，政府可以修法處理。", ans: true, explanation: "社會規範會隨時代改變，政府可透過制定或修改法律來保障現代人的權益。" },
            { type: "TF", q: "卑南遺址是臺灣舊石器時期中最具代表性的遺址，當時已能製作出精美的打磨石器。", ans: false, explanation: "卑南遺址屬於「新石器時期」，以打磨石器、石板棺與精美玉器聞名。" },
            { type: "TF", q: "倫理道德規範哪些行為違法，一旦違反就會受到公權力處罰。", ans: false, explanation: "明確規範違法行為並由國家公權力強制處罰的是「法律」，而非倫理道德。" },
            { type: "TF", q: "史前人類學會簡單農耕及飼養家畜後，逐漸開始定居生活。", ans: true, explanation: "農業與畜牧業讓食物來源穩定，人類不再需要隨季節四處遷徙。" },

            // 4. 第一~二單元月考 B 卷 (B04)
            { type: "TF", q: "未成年人違法時，沒有法律可以加以處置。", ans: false, explanation: "政府制定有《少年事件處理法》等相關法律，以輔導與處置違法的未成年人。" },
            { type: "TF", q: "早期移民來臺的漢人，會將家鄉的神像奉請來臺，信仰也成為移民團結的重要媒介。", ans: true, explanation: "早期漢人渡海來臺時常奉請原鄉神明庇佑，廟宇也成為凝聚同鄉情感的中心。" },
            { type: "TF", q: "原住民族以口述的神話與傳說，世代傳承生活禁忌與祖靈訓示。", ans: true, explanation: "早期原住民族沒有文字，透過口耳相傳的神話傳說來傳承文化、規範與生態智慧。" },
            { type: "TF", q: "在花蓮縣海岸看到的海景，屬於太平洋海域。", ans: true, explanation: "臺灣東部的花蓮、臺東緊鄰浩瀚的太平洋。" },
            { type: "TF", q: "風俗習慣是人們受自然環境和歷史文化影響，累積的生活方式。", ans: true, explanation: "風俗習慣是長期生活經驗與文化傳承所形成的慣例，如節慶習俗。" },
            { type: "TF", q: "西部海岸有較多曲折的海岸線和形狀奇特的岩石。", ans: false, explanation: "擁有曲折海岸線（岬灣）和奇岩怪石的是「北部海岸」；西部海岸多為平直沙岸。" },
            { type: "TF", q: "臺灣地理位置優越，是亞洲與太平洋海、空運的重要樞紐。", ans: true, explanation: "臺灣位於東亞島弧中心，是東北亞與東南亞海空運輸的必經要衝。" },

            // 5. 第一單元隨堂卷 (01)
            { type: "TF", q: "臺灣擁有綿長的海岸線，居民可以利用海洋資源發展各項活動。", ans: true, explanation: "臺灣四面環海、海岸線綿長，有利於發展漁業、鹽業、航運及觀光活動。" },
            { type: "TF", q: "地球表面分為許多大小相同的板塊，板塊間會相互推擠、碰撞。", ans: false, explanation: "地球表面的板塊「大小並不相同」，板塊運動會造成造山運動與地震。" },
            { type: "TF", q: "在史前時期，臺灣島上只有動物，沒有人類居住。", ans: false, explanation: "史前時期臺灣島上就已經有人類居住並留下許多史前遺址。" },
            { type: "TF", q: "臺灣與周圍地區經常發生地震，主要是因為地底下埋藏著許多史前遺址。", ans: false, explanation: "經常發生地震是因為臺灣位於「板塊交界帶」（歐亞板塊與菲律賓海板塊推擠），與史前遺址無關。" },
            { type: "TF", q: "臺灣總面積約360平方公里，而區域範圍中面積最大的是臺灣島。", ans: false, explanation: "臺灣總面積約為「36,000平方公里」（三萬六千平方公里），而非360平方公里。" },
            { type: "TF", q: "從卑南遺址發現的玉器飾品，可以推測當時人們已出現審美觀念。", ans: true, explanation: "人獸形玉玦等精美玉器飾品，顯示新石器時期的卑南人已具備高超工藝與審美觀念。" },

            // 6. 第二單元隨堂卷 (02)
            { type: "TF", q: "排灣族為階級社會，分成頭目、貴族、勇士、平民四個階級。", ans: true, explanation: "排灣族與魯凱族屬於嚴謹的階級社會，各階級有不同的權利、義務與服飾圖騰。" },
            { type: "TF", q: "早期來臺的漢人移民多與同姓的族群聚居在一起，並形成宗族組織。", ans: true, explanation: "早期漢人移民常與同姓族人聚居，建立家廟或宗祠，形成互助合作的宗族組織。" },
            { type: "TF", q: "住在山地及東部地區的原住民族，因較早與漢人接觸，文化多已和漢人融合。", ans: false, explanation: "較早與漢人接觸並融合的是居住在西部海岸、平原與丘陵的「平埔族群」；高山與東部族羣則保留較多傳統文化。" },
            { type: "TF", q: "宗教信仰源自於人們對自然與先人等的敬畏，並逐漸發展出指引信徒的教義。", ans: true, explanation: "人類因敬畏大自然與懷念先人而產生宗教信仰，勸人為善並安定人心。" },
            { type: "TF", q: "網路世界是虛擬的，不受法律拘束，所以可以在網路上任意辱罵別人。", ans: false, explanation: "網路世界同樣受現實法律拘束，在網路上辱罵他人會觸犯法律並受懲處。" },
            { type: "TF", q: "現今，政府為了符合社會需求，修法規定「兒子從父姓，女兒從母姓」。", ans: false, explanation: "現今民法修正為父母可透過約定，自由決定子女是從父姓或從母姓，而非硬性規定兒從父、女從母。" },
            { type: "TF", q: "政府以法律規定哪些行為違法，像是機車行駛人行道會受罰等。", ans: true, explanation: "交通法規屬於法律的一部分，違規行駛人行道會受到公權力開罰。" },

            { type: "TF", q: "【臺灣周圍島嶼】馬祖列島的名稱由來，和人們的宗教信仰（媽祖）有關。", ans: true, explanation: "相傳媽祖林默娘投海救父後遺體漂流至南竿島，居民建廟祭祀，因而得名馬祖列島。" },
            { type: "TF", q: "【臺灣周圍島嶼】金門群島上有很多日式風格建築，和早期日本人來臺貿易有關。", ans: false, explanation: "金門群島上有很多「中西合璧的洋樓（歐洲式風格建築）」，與早期金門人赴東南亞經商及歐洲國家到東南亞貿易有關。" },
            { type: "TF", q: "【法律的特性】法律明定了處罰的方式與範圍，也是國家執行公權力的依據。", ans: true, explanation: "法律由國家制定，明定違法行為的處罰方式與範圍，作為公權力執行的依據。" },
            { type: "TF", q: "【法律的特性】法律可以保障每個人的基本權利。", ans: true, explanation: "法律除了處罰違法者，最重要的目的在於保障全體人民的基本權利與自由。" },
            { type: "TF", q: "【法律的特性】法律一旦制定之後，就永遠不能再更改。", ans: false, explanation: "法律會隨著時代變遷與社會需求，透過立法院進行修法或廢止。" },

            // 4. 第一~二單元 B 卷 (B04) 第三、四、五、六大題
            { type: "MC", q: "【閱讀題組：史前遺址】「這個史前遺址的居民以稻米為主食，會到山中打獵，也會飼養家禽家畜。目前還從遺跡中發現大量的石柱、石棺及石刀等打磨石器，石棺中還發現精美的玉器飾品，像是人獸形玉玦等。」依內容判斷，文中提到的應該是哪一個史前遺址？", options: ["十三行遺址", "圓山遺址", "卑南遺址", "漢本遺址"], ans: 2, explanation: "出土石板棺、打磨石刀與「人獸形玉玦」是新石器時期「卑南遺址」的典型特徵。" },
            { type: "TF", q: "【漢人宗教祭祀】臺中大甲鎮瀾宮（媽祖）、高雄鳳山開漳聖王廟、臺北大龍峒保安宮（保生大帝）等漢人廟宇，常見的祭祀活動包含「舉辦廟會」與「舉行繞境活動」。", ans: true, explanation: "舉辦廟會、神明繞境巡安是臺灣傳統漢人廟宇常見的重要祭祀活動。" },
            { type: "TF", q: "【漢人宗教祭祀】漢人傳統廟宇（如媽祖廟、保安宮）最主要的祭祀活動是「定期做禮拜」與「相互潑水祈福」。", ans: false, explanation: "定期做禮拜是基督宗教（基督教、天主教）的活動，潑水祈福則是東南亞佛教（潑水節）習俗。" },
            { type: "MC", q: "【周圍島嶼位置】位於中國大陸閩江口外、臺灣本島西北方，與媽祖信仰有關的是哪一座群島？", options: ["馬祖列島", "金門群島", "澎湖群島", "綠島"], ans: 0, explanation: "位置最北、靠近閩江口的是「馬祖列島」（連江縣）。" },
            { type: "MC", q: "【周圍島嶼位置】緊鄰中國大陸廈門外海，早期居民赴東南亞發展並帶回歐洲式洋樓建築風格的是哪一座群島？", options: ["馬祖列島", "金門群島", "澎湖群島", "琉球嶼"], ans: 1, explanation: "位於廈門外海、擁有豐富洋樓與戰地史蹟的是「金門群島」。" },
            { type: "MC", q: "【周圍島嶼位置】位於臺灣本島與中國大陸之間的臺灣海峽上，由眾多島嶼組成的是哪一座群島？", options: ["綠島", "蘭嶼", "澎湖群島", "琉球嶼"], ans: 2, explanation: "位於臺灣海峽中央的是「澎湖群島」。" },
            { type: "MC", q: "【周圍島嶼位置】位於屏東縣東港外海（臺灣島西南方），屬於珊瑚礁島嶼的是哪一座島嶼？", options: ["馬祖列島", "金門群島", "綠島", "琉球嶼（小琉球）"], ans: 3, explanation: "位於屏東西南外海的珊瑚礁島嶼是「琉球嶼」（俗稱小琉球）。" },
            { type: "MC", q: "【周圍島嶼位置】位於臺東外海（臺灣島東南方太平洋上）的兩座火山島，北側較近的是綠島，南側較遠且為達悟族故鄉的是哪一座島嶼？", options: ["蘭嶼", "琉球嶼", "澎湖群島", "龜山島"], ans: 0, explanation: "臺東東南方太平洋上，北側為綠島，南側較遠的為「蘭嶼」。" },
            { type: "TF", q: "【法律行為判斷】心美因為考試成績不理想，自己塗改學校發的成績單。這種行為可能會觸犯法律（偽造文書）而受到懲處。", ans: true, explanation: "擅自塗改正式文書或成績單可能涉及偽造文書等違法行為。" },
            { type: "TF", q: "【法律行為判斷】文賢搭乘公車時，主動讓位給行動不便的老人。這種行為會受到法律懲處。", ans: false, explanation: "讓座給有需要的人是遵守倫理道德的優良美德，不會受到法律懲處。" },
            { type: "TF", q: "【法律行為判斷】正興和同事到燒烤店喝酒聊天，聚餐結束後「搭計程車」回家。這種行為會受到法律懲處。", ans: false, explanation: "喝酒後不開車、改搭計程車回家是守法且安全的行為，不會受罰（酒後駕車才會受罰）。" },
            { type: "TF", q: "【法律行為判斷】小香在網路上留言辱罵陌生人。這種行為會觸犯法律並受到懲處。", ans: true, explanation: "在網路上公開留言辱罵他人會觸犯刑法公然侮辱或誹謗罪，會受到法律懲處。" },

            // 5. 第一單元隨堂卷 (01) 第三、四、五大題
            { type: "TF", q: "【臺灣地理位置】從臺灣往北方經由「東海」可以抵達日本。", ans: true, explanation: "臺灣北方為東海，經由東海可前往日本與韓國。" },
            { type: "TF", q: "【臺灣地理位置】臺灣西方隔著臺灣海峽與「韓國」相望。", ans: false, explanation: "臺灣西方隔著臺灣海峽是與「中國大陸」相望，韓國則在臺灣北方。" },
            { type: "TF", q: "【臺灣地理位置】臺灣位於亞洲與「大西洋」的交會處。", ans: false, explanation: "臺灣位於亞洲大陸東側與「太平洋」的交會處。" },
            { type: "TF", q: "【臺灣地理位置】臺灣南方隔著「巴士海峽」與菲律賓相鄰。", ans: true, explanation: "臺灣南端隔巴士海峽與菲律賓群島相望。" },
            { type: "MC", q: "【海岸景點配對】位於臺灣「北部」的「龍洞」，屬於哪一種海岸類型？", options: ["珊瑚礁海岸", "岬灣海岸", "斷崖海岸", "沙洲海岸"], ans: 1, explanation: "東北角的龍洞位於臺灣北部，屬於海岬與海灣相間的「岬灣海岸」。" },
            { type: "MC", q: "【海岸景點配對】位於臺灣「南部」的「墾丁國家公園」，屬於哪一種海岸類型？", options: ["珊瑚礁海岸", "岬灣海岸", "斷崖海岸", "沙洲海岸"], ans: 0, explanation: "南部恆春半島的墾丁國家公園以溫暖海域的「珊瑚礁海岸」聞名。" },
            { type: "MC", q: "【海岸景點配對】位於臺灣「西部」的「大安溪出海口」，屬於哪一種海岸類型？", options: ["珊瑚礁海岸", "岬灣海岸", "斷崖海岸", "沙洲（沙岸）"], ans: 3, explanation: "西部河川（如大安溪）出海口泥沙堆積，屬於「沙洲（沙岸）」地形。" },
            { type: "MC", q: "【海岸景點配對】位於臺灣「東部」的「清水斷崖」，屬於哪一種海岸類型？", options: ["珊瑚礁海岸", "岬灣海岸", "斷崖海岸", "沙洲海岸"], ans: 2, explanation: "花蓮的清水斷崖位於臺灣東部，屬於高山緊鄰大海的「斷崖海岸」。" },
            { type: "MC", q: "【北回歸線地標】北回歸線是「太陽」直射地表最北端的假想線，政府在北回歸線通過的哪一個縣市設立了著名的北回歸線標誌館？", options: ["苗栗縣", "嘉義縣（及花蓮縣）", "臺北市", "屏東縣"], ans: 1, explanation: "北回歸線（北緯23.5度）通過臺灣的嘉義與花蓮，嘉義水上鄉與花蓮瑞穗、豐濱皆設有北回歸線標誌。" },

            // 6. 第二單元隨堂卷 (02) 第三、四大題
            { type: "TF", q: "【校園霸凌與法律】阿賢因個性內向常受到班上同學欺負，同學不僅嘲笑他的外貌，還故意搶走文具、把他的書包丟進垃圾桶。請問：班上同學嘲笑及欺負阿賢的行為，已經構成違法。", ans: true, explanation: "故意毀損他人書包物品、搶奪文具與公然侮辱嘲笑，皆已侵害他人權益並構成違法行為。" },
            { type: "TF", q: "【校園霸凌與法律】承上題，面對同學的霸凌與欺負，阿賢無法透過任何方式求助，只能自己改變個性。", ans: false, explanation: "遭受欺負時應勇敢向師長、父母反映，或透過校園反霸凌專線（1953）及法律途徑尋求協助與保護。" },
            { type: "TF", q: "【校園霸凌與法律】國家有特別制定相關法律（如《少年事件處理法》），讓行為偏差的未成年人有改過向上的機會。", ans: true, explanation: "《少年事件處理法》透過輔導與保護管束等措施，協助行為偏差的未成年人改過自新。" },
            { type: "TF", q: "【認識原住民族】「傳統領域」是指原住民族祖先原本生活、狩獵、耕作與祭祀的範圍。", ans: true, explanation: "傳統領域是原住民族世代生活的空間，蘊含豐富的文化與生態智慧。" },
            { type: "TF", q: "【認識原住民族】卑南族及阿美族為嚴格的「階級社會」（分為頭目、貴族、勇士、平民）。", ans: false, explanation: "分為頭目、貴族、勇士、平民四個階級的是「排灣族」與「魯凱族」；阿美族與卑南族則以「母系社會」與年齡階層著稱。" },
            { type: "TF", q: "【認識原住民族】「庫巴」是鄒族成年男子訓練、祭祀與討論部落事務的地方。", ans: true, explanation: "庫巴（Kuba）是鄒族部落社會組織的核心場所。" },
            { type: "TF", q: "【認識原住民族】在原住民族的母系社會中，財產多由女兒繼承，男方婚後則隨妻居住。", ans: true, explanation: "阿美族等母系社會中，家屋與土地主要由女子繼承，婚姻採男方入贅隨妻居住。" }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let selectedOption = null;

        function startQuiz() {
            const countValue = document.getElementById('question-count').value;
            let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);

            if (countValue === "all") {
                currentQuizQuestions = shuffled;
            } else {
                const limit = parseInt(countValue);
                currentQuizQuestions = shuffled.slice(0, limit);
            }

            currentIndex = 0;
            correctCount = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            loadQuestion();
        }

        function getCurrentScore() {
            return Math.round((correctCount / currentQuizQuestions.length) * 100);
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `題目 ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;

            const container = document.getElementById('question-container');
            
            if (qData.type === "TF") {
                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （是非題）${qData.q}</h3>
                    <div class="space-y-3">
                        <button onclick="checkAnswer(true, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">○</span> 正確 (O)
                        </button>
                        <button onclick="checkAnswer(false, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">×</span> 錯誤 (X)
                        </button>
                    </div>
                `;
            } else {
                let optionsHtml = '';
                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">${idx + 1}</span> <span>${opt}</span>
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                correctCount++;
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${getCurrentScore()} 分`;
                document.getElementById('final-detail').innerText = `共挑戰 ${currentQuizQuestions.length} 題，答對 ${correctCount} 題`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>
