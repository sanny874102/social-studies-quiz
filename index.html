<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級社會科線上練習大題庫（阿妮的版本）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i> 115上 南一五年級社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：第一~二單元（整合月考卷與隨堂練習完整題庫）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[240px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="all" selected>挑戰全部題庫（共 55 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">目前得分：0 分</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-study/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 整合月考卷與隨堂卷的完整題庫資料
        const allQuestions = [
            // 是非題
            { type: "TF", q: "原住民族的祖先認為萬物皆有神靈，相信「萬物有靈」。", ans: true, explanation: "原住民族傳統信仰中普遍相信萬物皆有神靈，也就是「萬物有靈」的觀念。" },
            { type: "TF", q: "媽祖是跨地域的信仰，擁有眾多的信眾。", ans: true, explanation: "媽祖是臺灣非常普遍且跨地域的重要民間信仰，擁有廣大信眾。" },
            { type: "TF", q: "發表毀損別人名譽的言論，並不會受到任何處罰。", ans: false, explanation: "發表毀損他人名譽的言論可能會觸犯法律（如妨害名譽罪），因此會受到法律處罰。" },
            { type: "TF", q: "人們會利用岬灣修築港口，從事航運、漁業等活動。", ans: true, explanation: "岬灣地形曲折、風浪較小，常被用來修築港口與發展漁業、航運。" },
            { type: "TF", q: "「規範」是社會群體共同認可與遵守的行為標準。", ans: true, explanation: "規範即是社會成員共同認可與遵守的行為準則，用以維持社會秩序。" },
            { type: "TF", q: "某架飛機從臺灣出發，依最短路徑飛往韓國，其飛行過程會經過巴士海峽。", ans: false, explanation: "飛往北方或東北方的韓國會經過「東海」，而巴士海峽位於臺灣南方。" },
            { type: "TF", q: "如果傳統規範與現代社會需求產生衝突，政府可以修法處理。", ans: true, explanation: "隨著時代變遷與社會價值改變，政府可以透過立法或修法來調整規範。" },
            { type: "TF", q: "卑南遺址是臺灣舊石器時期中最具代表性的遺址，當時已能製作出精美的打磨石器。", ans: false, explanation: "卑南遺址屬於「新石器時期」，舊石器時期最具代表性的遺址是長濱遺址。" },
            { type: "TF", q: "倫理道德規範哪些行為違法，一旦違反就會受到公權力處罰。", ans: false, explanation: "規範哪些行為違法並由公權力執行處罰的是「法律規範」，而非倫理道德。" },
            { type: "TF", q: "史前人類學會簡單農耕及飼養家畜後，逐漸開始定居生活。", ans: true, explanation: "農耕與飼養家畜讓人們得以穩定取得食物，不必四處遷徙，進而發展出定居生活。" },
            { type: "TF", q: "考古學家主要以器物材質和製作方法等差異，劃分舊石器時期、新石器時期及金屬器時期。", ans: true, explanation: "史前時代的科學分期主要是依據工具的材質與製作技術來區分的。" },
            { type: "TF", q: "未成年人違法時，沒有法律可以加以處置。", ans: false, explanation: "我國訂有少年事件處理法等相關法律，以妥善輔導與處置違法的未成年人。" },
            { type: "TF", q: "早期移民來臺的漢人，會將家鄉的神像奉請來臺，信仰也成為移民團結的重要媒介。", ans: true, explanation: "漢人移民渡海來臺時常奉請家鄉神像以求平安，也藉此凝聚同鄉與宗族力量。" },
            { type: "TF", q: "原住民族以口述的神話與傳說，世代傳承生活禁忌與祖靈訓示。", ans: true, explanation: "口述神話與傳說是原住民族沒有文字以前，世代傳承生活智慧與禁忌的重要方式。" },
            { type: "TF", q: "在花蓮縣海岸看到的海景，屬於太平洋海域。", ans: true, explanation: "臺灣東部海岸（如花蓮、臺東）面向太平洋。" },
            { type: "TF", q: "風俗習慣是人們受自然環境和歷史文化影響，累積的生活方式。", ans: true, explanation: "風俗習慣反映了長久以來人們在特定環境與歷史文化下累積的生活經驗。" },
            { type: "TF", q: "西部海岸有較多曲折的海岸線和形狀奇特的岩石。", ans: false, explanation: "曲折海岸線與奇岩怪石主要分布在北部或東部海岸，西部海岸多為沙岸與平直海岸。" },
            { type: "TF", q: "臺灣地理位置優越，是亞洲與太平洋海、空運的重要樞紐。", ans: true, explanation: "臺灣位於東亞交通要衝，是連接亞洲與太平洋的重要海空運樞紐。" },
            { type: "TF", q: "南海諸島位於臺灣島的東南方。", ans: false, explanation: "南海諸島位於臺灣島的南方與西南方。" },
            { type: "TF", q: "蘭嶼位於臺灣島東側的太平洋海域上。", ans: true, explanation: "蘭嶼位於臺灣東南方太平洋海域上，是雅美族（達悟族）的故鄉。" },
            // 新增隨堂卷是非題
            { type: "TF", q: "臺灣擁有綿長的海岸線，居民可以利用海洋資源發展各項活動[cite: 10]。", ans: true, explanation: "臺灣海岸線綿長，居民可發展漁業、航運與觀光等海洋活動[cite: 10]。" },
            { type: "TF", q: "地球表面分為許多大小相同的板塊，板塊間會相互推擠、碰撞[cite: 10]。", ans: false, explanation: "地球表面的板塊大小並不相同[cite: 10]。" },
            { type: "TF", q: "因為優勢的地理位置，臺灣成為部分候鳥度冬的區域[cite: 10]。", ans: true, explanation: "臺灣位處候鳥遷徙的中繼站，是重要的候鳥度冬區[cite: 10]。" },
            { type: "TF", q: "在史前時期，臺灣島上只有動物，沒有人類居住[cite: 10]。", ans: false, explanation: "史前時期臺灣島上已有豐富的人類活動與多處遺址[cite: 10]。" },
            { type: "TF", q: "臺灣與周圍地區經常發生地震，主要是因為地底下埋藏著許多史前遺址[cite: 10]。", ans: false, explanation: "地震頻繁是因為位於板塊交界處，與史前遺址無關[cite: 10]。" },
            { type: "TF", q: "生活在八仙洞遺址的人們，已經會用火來燒烤食物[cite: 10]。", ans: true, explanation: "舊石器時代的長濱遺址（八仙洞）居民已學會用火[cite: 10]。" },
            { type: "TF", q: "臺灣總面積約360平方公里，而區域範圍中面積最大的是臺灣島[cite: 10]。", ans: false, explanation: "臺灣總面積約 3.6 萬平方公里（36,000平方公里）[cite: 10]。" },
            { type: "TF", q: "排灣族為階級社會，分成頭目、貴族、勇士、平民四個階級[cite: 12]。", ans: true, explanation: "排灣族與魯凱族具有嚴格的社會階級制度[cite: 12]。" },
            { type: "TF", q: "住在山地及東部地區的原住民族，因較早與漢人接觸，文化多已和漢人融合[cite: 12]。", ans: false, explanation: "平地與西部平原的平埔族群較早與漢人接觸融和，山地及東部原住民族保留較多傳統文化[cite: 12]。" },
            { type: "TF", q: "網路世界是虛擬的，不受法律拘束，所以可以在網路上任意辱罵別人[cite: 12]。", ans: false, explanation: "網路世界同樣受法律規範，在網路上辱罵他人會觸犯妨害名譽罪[cite: 12]。" },

            // 選擇題
            { type: "MC", q: "下列關於早期來臺漢人移民宗教信仰和宗族組織的敘述，哪一項錯誤？", options: ["會將家鄉廟宇的神像奉請來臺", "同姓的族群常聚居在一起，形成宗族組織", "「庫巴」為男子集會所，用於討論宗族事務", "廟宇是社區重要的信仰與活動中心"], ans: 2, explanation: "「庫巴」是鄒族原住民族的男子集會所，不是漢人的宗族組織。" },
            { type: "MC", q: "下列哪一個史前遺址的人們，尚未發展出農耕活動？", options: ["圓山遺址", "卑南遺址", "十三行遺址", "八仙洞遺址"], ans: 3, explanation: "八仙洞遺址屬於舊石器時期，當時人們以採集、狩獵為主，尚未發展出農耕活動。" },
            { type: "MC", q: "下列哪項是生活中的規範之一？", options: ["風俗習慣", "倫理道德", "宗教信仰", "以上都是"], ans: 3, explanation: "生活中的規範包含風俗習慣、倫理道德、宗教信仰以及法律等。" },
            { type: "MC", q: "下列有關臺灣海岸地形的敘述，哪一項錯誤？", options: ["東部海岸斷崖聳立", "北部海岸有奇岩怪石", "西部海岸地形陡峭，出海口有沙洲", "南部恆春半島海域溫暖，形成特殊珊瑚礁海岸"], ans: 2, explanation: "西部海岸地形平緩開闊，並非地形陡峭。" },
            { type: "MC", q: "原住民族的社會制度，有些會以親族劃分，像是阿美族的母系社會，下列哪一項是母系社會的特色之一？", options: ["財產大多由女兒繼承", "婚後，男方會隨妻子居住", "子女的姓氏會隨母姓", "以上選項都是"], ans: 3, explanation: "母系社會的特色包含財產由女性繼承、婚後男方隨妻居住及子女從母姓等。" },
            { type: "MC", q: "臺灣與下列哪一個國家，隔著巴士海峽相鄰？", options: ["菲律賓", "中國", "新加坡", "柬埔寨"], ans: 0, explanation: "臺灣南方隔著巴士海峽與菲律賓相鄰。" },
            { type: "MC", q: "下列哪一個原因導致臺灣島的高度持續增加，且地震頻繁發生？", options: ["板塊推擠", "颱風頻繁", "海流改變", "人口過多"], ans: 0, explanation: "臺灣位於歐亞大陸板塊與菲律賓海板塊交界處，板塊推擠導致地勢升高且地震頻繁。" },
            { type: "MC", q: "「位於中央山脈的，過去常有許多野生動物在湖邊喝水，是布農族重要的傳統領域。」上述的◇指的是下列哪項？", options: ["澄清湖", "日月潭", "嘉明湖", "七彩湖"], ans: 2, explanation: "嘉明湖位於中央山脈，是布農族重要的傳統領域與神聖場域。" },
            { type: "MC", q: "下列哪一種社會規範，會明定處罰方式與範圍？", options: ["風俗習慣", "倫理道德", "宗教信仰", "法律"], ans: 3, explanation: "「法律」由國家制定，會明確規定行為規範以及違反後的處罰方式與範圍。" },
            { type: "MC", q: "下列哪一項是制定少年事件處理法的目的？", options: ["健全兒少身心發展", "讓行為偏差的未成年能改過自新", "保護未成年不受侵害", "以上都是"], ans: 3, explanation: "少年事件處理法旨在保護未成年人、協助其健全發展並改過自新。" },
            { type: "MC", q: "下列哪一條是在世界地圖上的假想線，將地球分為南、北半球？", options: ["北回歸線", "赤道", "180度經線", "0度經線"], ans: 1, explanation: "「赤道」（0度緯線）是將地球分為南半球與北半球的假想線。" },
            { type: "MC", q: "「豪豪是位虔誠的穆斯林，平時謹遵古蘭經的教誨，遵守禁食豬肉、不飲酒等戒律。」上述豪豪的行為，是受到下列哪種規範的影響？", options: ["倫理道德", "法律", "宗教信仰", "風俗習慣"], ans: 2, explanation: "伊斯蘭教的教誨與戒律屬於「宗教信仰」規範。" },
            { type: "MC", q: "下列有關宗教信仰的敘述，哪項錯誤？", options: ["源自人類對超自然力量的敬畏", "原住民族相信萬物有靈", "Gaga是漢人跨越地域的信仰", "透過閱讀經典、遵守戒律等方式，規範信徒的言行"], ans: 2, explanation: "「Gaga」是泰雅族（原住民族）的祖靈訓示與生活規範，不是漢人信仰。" },
            { type: "MC", q: "「在原住民族的社會中，族人的凝聚力是延續部落文化及精神的支柱，像是鄒族的成年男子利用『◇』，討論部落事務。」上述的◇應該填入下列哪一項？", options: ["庫巴", "宗祠", "家廟", "農耕地"], ans: 0, explanation: "鄒族的男子集會所稱為「庫巴」（Kuba），是討論部落重大事務與傳承文化的場所。" },
            { type: "MC", q: "下列哪一項是原住民族母系社會的特色？", options: ["子女隨母姓", "有廟會活動", "廟宇是重要信仰中心", "女方婚後隨夫居住"], ans: 0, explanation: "母系社會特色包含子女隨母姓、財產由女性繼承等。" },
            { type: "MC", q: "阿光是生活在史前時期八仙洞遺址的居民，他較可能居住在下列哪一個地方？", options: ["架高的干欄式住屋", "利用木材和石柱搭建的房舍", "以磚瓦興建的三合院", "天然形成的洞穴"], ans: 3, explanation: "長濱文化八仙洞遺址屬於舊石器時代，當時人們多居住在海蝕洞等天然洞穴中。" },

            { type: "MC", q: "下列有關法律的敘述，哪一項錯誤？", options: ["明定處罰方式與範圍", "國家執行公權力的依據", "保障每個人的基本權利", "制定之後就不能再更改"], ans: 3, explanation: "法律隨著時代與社會需求變遷，可以經由立法院修法或增刪更改。" },
            // 新增隨堂卷選擇題
            { type: "MC", q: "臺灣島浮出海面，與下列哪一個板塊的活動較有關？[cite: 10]", options: ["太平洋板塊", "非洲板塊", "歐亞板塊", "南極板塊"], ans: 2, explanation: "臺灣島主要是由歐亞大陸板塊與菲律賓海板塊擠壓推擠而浮出海面[cite: 10]。" },
            { type: "MC", q: "臺灣哪一個區域的海岸擁有較多斷崖景觀？[cite: 10]", options: ["北部", "西部", "南部", "東部"], ans: 3, explanation: "臺灣東部海岸（如清水斷崖）緊鄰太平洋，地形陡峭、斷崖聳立[cite: 10]。" },
            { type: "MC", q: "下列哪一座島嶼位於臺灣島的東南方？[cite: 10]", options: ["金門群島", "馬祖列島", "澎湖群島", "綠島"], ans: 3, explanation: "綠島與蘭嶼位於臺灣島的東南方海域[cite: 10]。" },
            { type: "MC", q: "高雄港是利用下列哪種海岸地形開發而成的重要商港？[cite: 10]", options: ["珊瑚礁", "潟湖", "岬灣", "斷崖"], ans: 1, explanation: "高雄港早期是利用天然潟湖地形（打狗港）開發而成的商港[cite: 10]。" },

            { type: "MC", q: "阿富是生活在十三行遺址的人類，下列哪項較可能是他對生活的描述？[cite: 10]", options: ["搭乘飛機旅行", "住在西式洋樓", "跟遠方親友視訊", "擁有煉製鐵器的技術"], ans: 3, explanation: "十三行遺址屬於金屬器時代，當時的人們已經掌握了煉鐵技術[cite: 10]。" },
            { type: "MC", q: "史前時期的劃分，是依據下列哪一項？[cite: 10]", options: ["人們的平均壽命", "製作器物的方法", "農作物的種類", "候鳥的棲息路線"], ans: 1, explanation: "考古學家主要依據工具的材質與製作方法（石器、金屬器）來劃分史前時期[cite: 10]。" },
            { type: "MC", q: "下列哪一項是臺灣東部地區適合發展賞鯨業的原因？[cite: 10]", options: ["離岸的海水深度達數百公尺", "岩層較軟", "海域較為平靜", "以上都是"], ans: 0, explanation: "東部外海離岸不遠海水深度即達數百公尺，吸引許多鯨豚迴游，適合發展賞鯨[cite: 10]。" },
            { type: "MC", q: "人面造型陶罐是在哪個遺址中發現的？[cite: 10]", options: ["八仙洞", "十三行", "卑南", "圓山"], ans: 1, explanation: "精美的人面造型陶罐是十三行遺址的代表性出土文物[cite: 10]。" },
            { type: "MC", q: "「林博士在進行史前遺址挖掘工作時，發現由貝殼堆積而成的貝塚。」判斷林博士挖掘到的較可能是？[cite: 10]", options: ["卑南", "十三行", "圓山", "漢本"], ans: 2, explanation: "圓山遺址以出土貝塚（食用後丟棄的貝殼堆積）聞名[cite: 10]。" },
            { type: "MC", q: "娟娟心情不好時向媽媽大發脾氣，看到媽媽錯愕感到愧疚。娟娟的行為違反了哪種社會規範？[cite: 12]", options: ["倫理道德", "法律", "宗教信仰", "風俗習慣"], ans: 0, explanation: "對父母親長輩應保持孝道與禮貌，頂撞父母違反了倫理道德規範[cite: 12]。" },
            { type: "MC", q: "下列哪一項是國家執行公權力的後盾？[cite: 12]", options: ["法律", "倫理道德", "宗教信仰", "風俗習慣"], ans: 0, explanation: "「法律」由國家制定並以公權力強制執行，是國家維持秩序的後盾[cite: 12]。" }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;

        function startQuiz() {
            const countValue = document.getElementById('question-count').value;
            let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);

            if (countValue === "all") {
                currentQuizQuestions = shuffled;
            } else {
                const limit = parseInt(countValue);
                currentQuizQuestions = shuffled.slice(0, limit);
            }

            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `題目 ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-text').innerText = `目前得分：${score} 分`;

            const container = document.getElementById('question-container');
            
            if (qData.type === "TF") {
                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4">${currentIndex + 1}. （是非題）${qData.q}</h3>
                    <div class="space-y-3">
                        <button onclick="checkAnswer(true, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">○</span> 正確 (O)
                        </button>
                        <button onclick="checkAnswer(false, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">×</span> 錯誤 (X)
                        </button>
                    </div>
                `;
            } else {
                let optionsHtml = '';
                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">${idx + 1}</span> ${opt}
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score += Math.round(100 / currentQuizQuestions.length);
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `目前得分：${score} 分`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${score} 分`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>
